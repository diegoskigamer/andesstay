server:
  port: 8080

spring:
  application:
    name: andesstay-backend

  datasource:
    url: jdbc:h2:mem:andesstay;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  jackson:
    default-property-inclusion: non_null

# --- Security placeholder -----------------------------------------------
# Cuando se active Azure AD, esto se completa con:
# security:
#   oauth2:
#     resourceserver:
#       jwt:
#         issuer-uri: https://login.microsoftonline.com/<TENANT_ID>/v2.0
#         audiences: api://<API_CLIENT_ID>
# Por ahora la seguridad está DESHABILITADA (ver config/SecurityConfig.java)
andesstay:
  security:
    enabled: false
