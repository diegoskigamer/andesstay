server:
  port: 8080

spring:
  application:
    name: andesstay-backend

  datasource:
    url: jdbc:h2:mem:andesstay;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  jackson:
    default-property-inclusion: non_null

andesstay:
  security:
    enabled: false

cognito:
  region: ${COGNITO_REGION:}
  user-pool-id: ${COGNITO_USER_POOL_ID:}
  client-id: ${COGNITO_CLIENT_ID:}
  client-secret: ${COGNITO_CLIENT_SECRET:}
  domain: ${COGNITO_DOMAIN:}